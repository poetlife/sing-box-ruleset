[project]
name = "sing-box-ruleset"
version = "0.1.4"
description = "YAML-annotated rulesets compiled to sing-box (.srs) and Clash.Meta Classical (.yaml) formats."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "loguru",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
